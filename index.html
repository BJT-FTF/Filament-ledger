<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181210" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4efe8" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Filament">
  <meta name="description" content="Track 3D printer filament costs, spool remainder, and print jobs in Australian dollars.">
  <title>Filament Ledger</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="brand">
      <img src="icon-192.png" alt="" class="brand-icon" width="36" height="36">
      <div class="brand-text">
        <h1>Filament Ledger</h1>
        <p class="tagline">Costs &amp; remainder</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" id="theme-btn" class="icon-btn" aria-label="Toggle theme" title="Theme">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.5 5.5 0 0 1-7.54-7.54C12.92 3.04 12.46 3 12 3z"/></svg>
      </button>
      <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="app-menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
      </button>
    </div>
  </header>

  <div id="app-menu" class="menu" hidden role="menu" aria-labelledby="menu-btn">
    <button type="button" role="menuitem" data-action="settings">Settings</button>
    <button type="button" role="menuitem" data-action="export-json">Export JSON backup</button>
    <button type="button" role="menuitem" data-action="import-json">Import JSON backup</button>
    <button type="button" role="menuitem" data-action="export-csv">Export print log CSV</button>
    <button type="button" role="menuitem" data-action="install" id="install-item" hidden>Install on this device</button>
  </div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <main id="main">
    <section id="view-spools" class="view" data-view="spools"></section>
    <section id="view-prints" class="view" hidden data-view="prints"></section>
    <section id="view-calc" class="view" hidden data-view="calc"></section>
    <section id="view-summary" class="view" hidden data-view="summary"></section>
  </main>

  <nav class="tab-bar" aria-label="Primary">
    <button type="button" class="tab-btn is-active" data-nav="spools">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a9 9 0 1 0 .01 0zM12 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm0 3.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6zM12 9a1.8 1.8 0 1 1 0 3.6A1.8 1.8 0 0 1 12 9z"/></svg>
      <span>Spools</span>
    </button>
    <button type="button" class="tab-btn" data-nav="prints">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 3h10a2 2 0 0 1 2 2v3h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v3a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-3H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V5a2 2 0 0 1 2-2zm0 2v3h10V5H7zm0 14h10v-3H7v3zM4 10v5h16v-5H4zm13 1.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>
      <span>Prints</span>
    </button>
    <button type="button" class="tab-btn" data-nav="calc">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 2h10a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3zm0 2a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H7zm1 2h8v3H8V6zm0 5h2.2v2.2H8V11zm3.4 0h2.2v2.2h-2.2V11zm3.4 0H18v2.2h-2.2V11zM8 14.4h2.2V16.6H8v-2.2zm3.4 0h2.2V16.6h-2.2v-2.2zm3.4 0H18V16.6h-2.2v-2.2zM8 17.8h2.2V20H8v-2.2zm3.4 0h2.2V20h-2.2v-2.2z"/></svg>
      <span>Calculator</span>
    </button>
    <button type="button" class="tab-btn" data-nav="summary">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 19h16v2H4v-2zM5 4h3v13H5V4zm5.5 6h3v7h-3v-7zM16 8h3v9h-3V8z"/></svg>
      <span>Summary</span>
    </button>
  </nav>

  <div id="overlay-root"></div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
